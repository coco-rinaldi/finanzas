<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="money honey">
<meta name="theme-color" content="#f2ede4">
<title>what ’bout money honey?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme:light;
  --paper:#f5f0e7;--ink:#191815;--mute:#81796e;--hair:rgba(25,24,21,.2);
  --red:#a94c35;--green:#68715a;--soft:#e8e1d5;--serif:'Instrument Serif',Georgia,'Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.28;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
.page{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 24px calc(env(safe-area-inset-bottom) + 52px)}
.date{border-bottom:1px solid var(--ink);padding:0 0 9px;margin-bottom:20px}
.kicker{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.masthead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font-weight:400;font-size:clamp(48px,11vw,86px);line-height:.78;letter-spacing:-.045em;margin:8px 0 13px;max-width:610px}
h1 em{font-style:italic}
.tagline{font-size:clamp(17px,4vw,23px);font-style:italic;color:#5e594f;margin:0 0 30px;text-align:right}
nav{display:flex;gap:clamp(18px,6vw,54px);border-bottom:1px solid var(--ink);margin-bottom:24px;overflow-x:auto}
nav button{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:0 0 10px;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom:2px solid var(--ink);margin-bottom:-1px}
.tab{display:none}.tab.on{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.dash-grid{display:grid;grid-template-columns:.92fr 1.08fr;gap:14px;align-items:stretch}
.editorial-card{border:1px solid #b9ad9c;border-radius:2px;padding:18px 18px 16px;min-width:0}
.card-title{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:17px}
.account-row{padding:0 0 14px;margin-bottom:13px;border-bottom:1px solid var(--hair)}
.account-row:last-of-type{border-bottom:0;margin-bottom:0;padding-bottom:2px}
.account-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.account-name{font-size:21px;line-height:1.05}
.account-total{font-size:clamp(25px,4vw,36px);line-height:.98;letter-spacing:-.025em;margin:7px 0 4px}
.account-sub{font-size:12px;font-style:italic;color:var(--mute);line-height:1.35}
.account-actions{display:flex;gap:13px;margin-top:6px}
.small-action{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:underline dotted;text-underline-offset:3px}
.plus{font-family:var(--serif);font-size:19px;width:23px;height:23px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;line-height:1;padding-bottom:2px}
.available-block{border-top:1px solid var(--ink);margin-top:13px;padding-top:12px}
.available-label{font-size:13px;font-style:italic;color:var(--mute)}
.available-number{font-size:clamp(32px,6vw,48px);line-height:.95;letter-spacing:-.035em;margin:7px 0 3px}
.available-note{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rate-line{margin-top:13px;padding-top:9px;border-top:1px dotted var(--hair);font-size:12px;color:var(--mute);font-style:italic}
.rate-line button{text-decoration:underline dotted;text-underline-offset:3px}
.reserve-line{padding:0 0 13px;margin-bottom:12px;border-bottom:1px solid var(--hair)}
.reserve-line:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.reserve-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.reserve-name{font-size:18px;line-height:1.05}
.reserve-amount{font-family:var(--mono);font-size:9px;color:var(--mute);white-space:nowrap}
.bar{height:3px;background:rgba(25,24,21,.13);position:relative;margin:8px 0 5px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;height:100%;background:var(--green)}
.bar.warn i{background:var(--red)}
.reserve-foot{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.reserve-footer{border-top:1px solid var(--ink);margin-top:16px;padding-top:10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.reserve-footer span:first-child{font-style:italic;font-size:14px}
.reserve-footer button{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--ink);padding-bottom:9px;margin-bottom:7px}
h2{font-weight:400;font-size:clamp(40px,9vw,58px);line-height:.85;letter-spacing:-.03em}
.sec-h em{font-size:15px;color:var(--mute)}
.intro{font-size:16px;font-style:italic;text-align:justify;color:#514c44;margin:13px 0 18px;max-width:600px}
.month-card{padding:15px 0 17px;border-bottom:1px solid var(--hair)}
.month-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.month-head strong{font-size:27px;font-weight:400}
.month-head span{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.month-summary{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute);font-style:italic}
.obligation{padding:10px 0 8px;border-top:1px dotted var(--hair)}
.ob-top{display:flex;align-items:center;gap:8px}
.ob-name{font-size:18px;flex:1;min-width:0}
.ob-edit{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.ob-edit label{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.in{font-family:var(--serif);font-size:16px;background:none;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:3px 0;outline:none;min-width:0}
.in:focus{border-color:var(--ink)}
.in.money,.in.reserve{width:90px;text-align:right}
.source{font-family:var(--mono);font-size:9px;background:none;border:0;border-bottom:1px dotted var(--mute);border-radius:0;padding:3px 0;max-width:110px}
.ob-bar{height:2px;background:rgba(25,24,21,.12);margin-top:8px;position:relative}
.ob-bar i{position:absolute;left:0;top:0;height:100%;background:var(--green)}
.ob-bar.warn i{background:var(--red)}
.add{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;padding:14px 0;color:var(--mute)}
.item{padding:12px 0;border-bottom:1px solid var(--hair)}
.income-line{display:grid;grid-template-columns:minmax(75px,1fr) auto auto 25px;gap:8px;align-items:center}
.income-line .name{width:100%;font-size:18px}
.income-line .amount-in{width:94px;text-align:right}
.currency{font-family:var(--mono);font-size:10px;color:var(--mute);border-bottom:1px dotted var(--mute);padding:3px 0}
.x{font-size:20px;color:var(--mute);width:24px;text-align:right;line-height:1}
.income-meta{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
.income-meta .in{font-size:13px;max-width:130px}
.income-meta select{font-family:var(--mono);font-size:9px;color:var(--mute);border:0;border-bottom:1px dotted var(--mute);background:none;max-width:130px}
.status{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.status.received{color:var(--green)}
.collect{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.collect.done{color:var(--green)}
.sum{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ink);padding-top:9px;margin-top:13px}
.sum .v{font-size:27px;letter-spacing:-.02em}
.note{font-style:italic;font-size:14px;margin:12px 0;text-align:justify;color:var(--mute)}
.alert{color:var(--red)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:10;background:var(--paper);border-top:1px solid var(--ink);padding:20px 22px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet h3{font-weight:400;font-style:italic;font-size:30px;line-height:1.05;margin:5px 0 16px}
#f-amt{display:block;width:100%;font-family:var(--serif);font-size:34px;background:none;color:var(--ink);border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:3px 0;outline:none;margin-bottom:16px}
#f-amt.err{border-bottom-color:var(--red)}
#f-dest{font-family:var(--mono);font-size:11px;background:none;border:0;border-bottom:1px solid var(--hair);padding:9px 0;width:100%;margin-bottom:16px}
.sh-actions{display:flex;justify-content:flex-end;align-items:center;gap:20px}
.sh-actions button{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute);padding:11px 0}
#sh-ok{background:var(--ink);color:var(--paper);padding:12px 19px}
@media(max-width:620px){
 .page{padding-left:18px;padding-right:18px}
 .dash-grid{grid-template-columns:1fr;gap:12px}
 .editorial-card{padding:17px 16px 15px}
 .account-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px}
 .account-top{grid-column:1/-1}
 .account-total{margin:5px 0 2px}
 .account-sub{grid-column:1}
 .account-actions{grid-column:2;grid-row:2/4;align-self:center;flex-direction:column;align-items:flex-end}
 .available-block{display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 10px}
 .available-label,.available-note{grid-column:1}
 .available-number{grid-column:2;grid-row:1/3;text-align:right;margin:0}
 .rate-line{grid-column:1/-1}
}
@media(max-width:370px){
 .page{padding-left:14px;padding-right:14px}
 .income-line{grid-template-columns:minmax(60px,1fr) auto auto 20px;gap:5px}
 .income-line .amount-in{width:72px}
 .in.money,.in.reserve{width:76px}
}

</style>
</head>
<body>
<main class="page">
  <header>
    <p class="date kicker" id="fecha"></p>
    <div class="masthead">
      <h1>what ’bout<br><em>money honey?</em></h1>
      <span class="kicker" style="padding-top:12px;color:var(--red)">♡</span>
    </div>
    <p class="tagline">tu panorama financiero, en una mirada.</p>
    <nav>
      <button data-tab="ahora" class="on">resumen</button>
      <button data-tab="reservas">gastos</button>
      <button data-tab="ingresos">ingresos</button>
    </nav>
  </header>
  <section id="ahora" class="tab on"></section>
  <section id="reservas" class="tab"></section>
  <section id="ingresos" class="tab"></section>
</main>
<div id="scrim"></div>
<form id="sheet" autocomplete="off">
  <p class="kicker" id="sh-kicker"></p>
  <h3 id="sh-title"></h3>
  <input id="f-amt" type="text" inputmode="decimal" placeholder="0">
  <select id="f-dest" hidden>
    <option value="mp">Mercado Pago</option>
    <option value="ef">Efectivo</option>
    <option value="pp">PayPal</option>
  </select>
  <div class="sh-actions">
    <button type="button" id="sh-cancel">cancelar</button>
    <button type="submit" id="sh-ok">guardar</button>
  </div>
</form>
<script>
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const KEY='moneyhoney.v2';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const now=new Date();
const monthKey=(offset=0)=>{const d=new Date(now.getFullYear(),now.getMonth()+offset,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const monthLabel=key=>{const [y,m]=key.split('-').map(Number);return `${MESES[m-1]} ${y}`};
const monthShort=key=>{const [y,m]=key.split('-').map(Number);return `${MESES[m-1]} ${String(y).slice(2)}`};
const monthStart=1;
function makeMonths(){
  const out=[];
  for(let i=1;i<=12;i++){
    const key=monthKey(i);
    const obligations=[
      {id:uid(),name:'alquiler',amount:412000,reserved:i===1?412000:0,source:'mp'},
      {id:uid(),name:'servicios',amount:100000,reserved:0,source:'mp'},
      {id:uid(),name:'expensas',amount:90000,reserved:i<=3?90000:0,source:'ef'},
      {id:uid(),name:'comida',amount:80000,reserved:0,source:'mp'}
    ];
    out.push({key,obligations});
  }
  return out;
}
const DEF={
  accounts:{mp:{amount:413000,last:null},pp:{amount:654,last:null},ef:{amount:360000,last:null}},
  rate:1500,months:makeMonths(),
  incomes:[
    {id:uid(),name:'brukas',month:'octubre 2026',amount:200,cur:'USD',received:false,dest:'pp'},
    {id:uid(),name:'brukas',month:'noviembre 2026',amount:200,cur:'USD',received:false,dest:'pp'},
    {id:uid(),name:'brukas',month:'diciembre 2026',amount:200,cur:'USD',received:false,dest:'pp'},
    {id:uid(),name:'viviana',month:'octubre 2026',amount:200000,cur:'ARS',received:false,dest:'mp'},
    {id:uid(),name:'viviana',month:'noviembre 2026',amount:200000,cur:'ARS',received:false,dest:'mp'},
    {id:uid(),name:'marvills',month:'pago único',amount:260000,cur:'ARS',received:false,dest:'mp'},
    {id:uid(),name:'klapa',month:'noviembre 2026',amount:450000,cur:'ARS',received:false,dest:'mp'}
  ]
};
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.accounts||!S.months||!S.incomes) S=JSON.parse(JSON.stringify(DEF));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ACC={mp:{name:'Mercado Pago',cur:'ARS'},ef:{name:'Efectivo',cur:'ARS'},pp:{name:'PayPal',cur:'USD'}};
const nf=(n,d=0)=>Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:d});
const ars=n=>'$ '+nf(Math.round(n));
const usd=n=>'US$ '+nf(n,2);
const money=(n,cur='ARS')=>`<span class="cs">${cur==='USD'?'US$':'$'}</span>${cur==='USD'?nf(n,2):nf(Math.round(n))}`;
const pct=p=>`${Math.round(p*100)}%`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function parse(str){
  let s=String(str).trim().replace(/[^\d.,-]/g,'');
  if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return Number.isFinite(n)?n:null;
}
const totalForMonth=m=>m.obligations.reduce((a,o)=>a+(Number(o.amount)||0),0);
const reservedForMonth=m=>m.obligations.reduce((a,o)=>a+(Number(o.reserved)||0),0);
const allocation=k=>S.months.reduce((a,m)=>a+m.obligations.reduce((b,o)=>b+(o.source===k?(Number(o.reserved)||0):0),0),0);
const free=k=>S.accounts[k].amount-allocation(k);
const freePersonal=()=>free('mp')+free('ef');
const coverage=m=>totalForMonth(m)>0?Math.min(1,reservedForMonth(m)/totalForMonth(m)):0;
const fullMonths=()=>{let n=0;for(const m of S.months){if(coverage(m)>=.999999)n++;else break;}return n};
const pctToSpend=()=>{const n=fullMonths();return n===0?0:n===1?.10:n===2?.20:.10};
const suggestedSpend=()=>Math.max(0,freePersonal())*pctToSpend();
const pendingTotal=(cur)=>S.incomes.filter(x=>!x.received&&(!cur||x.cur===cur)).reduce((a,x)=>a+x.amount,0);
const receivedTotal=(cur)=>S.incomes.filter(x=>x.received&&(!cur||x.cur===cur)).reduce((a,x)=>a+x.amount,0);

function accountHTML(k){
  const a=S.accounts[k],c=ACC[k],r=allocation(k),f=free(k);
  const sub=k==='pp'?'ahorro intocable · fondo de emergencia':`reservado ${ars(r)} · libre ${ars(f)}`;
  return `<div class="account-row">
    <div class="account-top"><span class="account-name">${c.name}</span></div>
    <div class="account-total">${money(a.amount,c.cur)}</div>
    <div class="account-sub">${sub}</div>
    <div class="account-actions">
      <button class="small-action" data-edit="${k}">editar saldo</button>
      <button class="small-action" data-add="${k}">+ sumar</button>
    </div>
  </div>`;
}
function renderAhora(){
  const A=S.accounts,available=freePersonal(),next=S.months[0];
  const visibleMonths=S.months.slice(0,3);
  const summaryObligations=[];
  visibleMonths.forEach(m=>m.obligations.forEach(o=>{
    if(o.reserved>0 || m===next) summaryObligations.push({m,o});
  }));
  $('#ahora').innerHTML=`
    <div class="dash-grid">
      <section class="editorial-card">
        <h2 class="card-title">tus cuentas</h2>
        ${accountHTML('mp')}
        ${accountHTML('ef')}
        ${accountHTML('pp')}
        <div class="available-block">
          <p class="available-label">tu dinero disponible</p>
          <p class="available-number">${money(Math.max(0,available))}</p>
          <p class="available-note">libre · mp + efectivo</p>
          <p class="rate-line">dólar de referencia: <button data-rate>${ars(S.rate)}</button></p>
        </div>
      </section>
      <section class="editorial-card">
        <h2 class="card-title">tus reservas por mes</h2>
        ${summaryObligations.map(({m,o})=>{
          const p=o.amount>0?Math.min(1,o.reserved/o.amount):0;
          return `<div class="reserve-line">
            <div class="reserve-top"><span class="reserve-name">${cap(o.name)} <span style="font-style:italic;color:var(--mute);font-size:13px">${MESES[Number(m.key.slice(5))-1]}</span></span><span class="reserve-amount">${ars(o.reserved)} / ${ars(o.amount)}</span></div>
            <div class="bar ${p<1?'warn':''}"><i style="width:${p*100}%"></i></div>
            <div class="reserve-foot"><span>${p>=1?'cubierto':'por cubrir'}</span><span>${pct(p)}</span></div>
          </div>`;
        }).join('')}
        <div class="reserve-footer"><span>referencia mensual</span><span>${ars(next?totalForMonth(next):682000)}</span></div>
        <div class="reserve-footer" style="border-top:0;margin-top:7px;padding-top:0">
          <span>planificá tus próximos meses</span><button data-tab="reservas">ver todos los gastos ↗</button>
        </div>
      </section>
    </div>`;
}
function obligationHTML(m,o){
  const p=o.amount>0?Math.min(1,o.reserved/o.amount):0;
  return `<div class="obligation" data-month="${m.key}" data-ob="${o.id}">
    <div class="ob-top"><span class="ob-name">${esc(o.name)}</span><button class="x" data-del-ob aria-label="eliminar obligación">×</button></div>
    <div class="ob-edit">
      <label>necesitás $</label><input class="in money" data-obfield="amount" value="${nf(o.amount)}" inputmode="decimal" aria-label="monto necesario">
      <label>reservado $</label><input class="in reserve" data-obfield="reserved" value="${nf(o.reserved)}" inputmode="decimal" aria-label="monto reservado">
      <select class="source" data-obfield="source" aria-label="cuenta de reserva">
        <option value="mp" ${o.source==='mp'?'selected':''}>mercado pago</option>
        <option value="ef" ${o.source==='ef'?'selected':''}>efectivo</option>
      </select>
    </div>
    <div class="ob-bar ${p<1?'warn':''}"><i style="width:${p*100}%"></i></div>
  </div>`;
}
function renderReservas(){
  $('#reservas').innerHTML=`
    <header class="sec-h"><h2>Gastos</h2><em>mes a mes</em></header>
    <p class="intro">Planificá cada gasto según su destino. Lo reservado deja de estar disponible para tus gastos personales. Las barras muestran cuánto falta para financiar cada mes.</p>
    ${S.months.map(m=>`<section class="month-card" data-month-card="${m.key}">
      <div class="month-head"><strong>${cap(monthLabel(m.key))}</strong><span>${coverage(m)>=.999999?'mes cubierto':'en construcción'}</span></div>
      <div class="month-summary"><span>${ars(reservedForMonth(m))} / ${ars(totalForMonth(m))}</span><span>${pct(coverage(m))}</span></div>
      <div class="bar ${coverage(m)<1?'warn':''}"><i style="width:${coverage(m)*100}%"></i></div>
      ${m.obligations.map(o=>obligationHTML(m,o)).join('')}
      <button class="add" data-new-ob="${m.key}">+ agregar obligación</button>
    </section>`).join('')}
    <p class="note">La referencia mensual actual es de ${ars(682000)}: alquiler, servicios, expensas y comida. Podés editar cualquier importe o agregar otros gastos.</p>`;
}
function incomeHTML(x){
  const destOpts=[['mp','mercado pago'],['ef','efectivo'],['pp','paypal']];
  return `<div class="item" data-income="${x.id}">
    <div class="income-line">
      <input class="in name" data-if="name" value="${esc(x.name)}" aria-label="cliente">
      <button class="currency" data-currency>${x.cur==='USD'?'US$':'$'}</button>
      <input class="in amount-in" data-if="amount" value="${nf(x.amount,2)}" inputmode="decimal" aria-label="importe" ${x.received?'disabled':''}>
      <button class="x" data-del-income aria-label="eliminar ingreso">×</button>
    </div>
    <div class="income-meta">
      <input class="in" data-if="month" value="${esc(x.month)}" aria-label="mes o concepto">
      <select data-if="dest" aria-label="cuenta donde ingresa" ${x.received?'disabled':''}>${destOpts.map(([v,l])=>`<option value="${v}" ${x.dest===v?'selected':''}>${l}</option>`).join('')}</select>
      <span class="status ${x.received?'received':''}">${x.received?'cobrado':'pendiente'}</span>
      <button class="collect ${x.received?'done':''}" data-collect>${x.received?'deshacer':'cobrar'}</button>
    </div>
  </div>`;
}
function renderIngresos(){
  $('#ingresos').innerHTML=`
    <header class="sec-h"><h2>Ingresos</h2><em>previstos / reales</em></header>
    <p class="intro">Un ingreso pendiente no cuenta como dinero disponible. Cuando lo cobres, tocá “cobrar” y se suma al saldo de la cuenta elegida.</p>
    ${S.incomes.map(incomeHTML).join('')}
    <button class="add" data-new-income>+ agregar ingreso</button>
    <div class="sum"><span class="kicker">pendiente en pesos</span><span class="v">${ars(pendingTotal('ARS'))}</span></div>
    <div class="sum"><span class="kicker">pendiente en dólares</span><span class="v">${usd(pendingTotal('USD'))}</span></div>
    <div class="sum"><span class="kicker">ya cobrado · pesos</span><span class="v">${ars(receivedTotal('ARS'))}</span></div>
    <div class="sum"><span class="kicker">ya cobrado · dólares</span><span class="v">${usd(receivedTotal('USD'))}</span></div>`;
}
function render(){
  const d=new Date();
  $('#fecha').textContent=`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
  renderAhora();renderReservas();renderIngresos();
}
function refreshDashboard(){renderAhora();}
function refreshMonth(key){
  const m=S.months.find(x=>x.key===key);if(!m)return;
  const card=document.querySelector(`[data-month-card="${key}"]`);if(!card)return;
  const p=coverage(m),bar=card.querySelector(':scope > .bar'),summary=card.querySelector('.month-summary'),head=card.querySelector('.month-head span');
  if(bar){bar.classList.toggle('warn',p<1);bar.querySelector('i').style.width=`${p*100}%`;}
  if(summary)summary.innerHTML=`<span>${ars(reservedForMonth(m))} / ${ars(totalForMonth(m))}</span><span>${pct(p)}</span>`;
  if(head)head.textContent=p>=.999999?'mes cubierto':'en construcción';
}
function findIncome(el){const r=el.closest('.item[data-income]');return r&&S.incomes.find(x=>x.id===r.dataset.income)}
document.addEventListener('input',e=>{
  const ob=e.target.closest('[data-obfield]'),inc=e.target.closest('[data-if]');
  if(ob){
    const card=ob.closest('[data-month]'),m=S.months.find(x=>x.key===card.dataset.month),o=m&&m.obligations.find(x=>x.id===card.dataset.ob);
    if(!o)return;
    if(ob.dataset.obfield!=='source'){const n=parse(ob.value);o[ob.dataset.obfield]=n===null?0:n;}
    save();refreshMonth(m.key);refreshDashboard();return;
  }
  if(inc){
    const x=findIncome(inc);if(!x)return;
    if(inc.dataset.if==='amount'&&!x.received){const n=parse(inc.value);x.amount=n===null?0:n;}
    if(inc.dataset.if==='name')x.name=inc.value;
    if(inc.dataset.if==='month')x.month=inc.value;
    save();return;
  }
});
document.addEventListener('change',e=>{
  const ob=e.target.closest('[data-obfield="source"]');
  if(ob){
    const card=ob.closest('[data-month]'),m=S.months.find(x=>x.key===card.dataset.month),o=m&&m.obligations.find(x=>x.id===card.dataset.ob);
    if(o){o.source=ob.value;save();refreshDashboard();}
    return;
  }
  const dest=e.target.closest('[data-if="dest"]');
  if(dest){const x=findIncome(dest);if(x&&!x.received){x.dest=dest.value;save();}}
});
let cfg=null;const fAmt=$('#f-amt'),fDest=$('#f-dest');
function openSheet(c){
  cfg=c;$('#sh-kicker').textContent=c.kicker||'';$('#sh-title').textContent=c.title;
  fAmt.value=c.amount!=null?nf(c.amount,2):'';fAmt.classList.remove('err');
  fDest.hidden=!c.destination;fDest.value=c.destination||'mp';
  $('#scrim').classList.add('on');$('#sheet').classList.add('on');
  setTimeout(()=>{fAmt.focus({preventScroll:true});if(fAmt.value)fAmt.select()},80);
}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');fAmt.blur();cfg=null;}
$('#sheet').addEventListener('submit',e=>{
  e.preventDefault();if(!cfg)return;
  const n=parse(fAmt.value);if(n===null||n<0){fAmt.classList.add('err');return;}
  cfg.onSave(n,fDest.value);save();closeSheet();render();
});
$('#sh-cancel').onclick=closeSheet;$('#scrim').onclick=closeSheet;
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.closest('#sheet'))return;
  const d=t.dataset;
  if(d.tab){
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===t));
    document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id===d.tab));
    window.scrollTo(0,0);return;
  }
  if(d.add){
    const k=d.add;openSheet({kicker:ACC[k].name,title:'Sumar dinero a la cuenta',amount:0,onSave:v=>{S.accounts[k].amount+=v;S.accounts[k].last={v,t:Date.now()};}});
  }
  if(d.edit){
    const k=d.edit;openSheet({kicker:ACC[k].name,title:'Corregir saldo total',amount:S.accounts[k].amount,onSave:v=>{S.accounts[k].amount=v;}});
  }
  if('rate'in d)openSheet({kicker:'tipo de cambio',title:'¿A cuánto está el dólar?',amount:S.rate,onSave:v=>{S.rate=v;}});
  if('newOb'in d){
    const m=S.months.find(x=>x.key===d.newOb);if(m)m.obligations.push({id:uid(),name:'nuevo gasto',amount:0,reserved:0,source:'mp'});
    save();renderReservas();refreshDashboard();
  }
  if('delOb'in d){
    const card=t.closest('[data-month]'),m=S.months.find(x=>x.key===card.dataset.month);
    if(m){m.obligations=m.obligations.filter(o=>o.id!==card.dataset.ob);save();renderReservas();refreshDashboard();}
  }
  if('newIncome'in d){S.incomes.push({id:uid(),name:'nuevo cliente',month:'',amount:0,cur:'ARS',received:false,dest:'mp'});save();renderIngresos();}
  if('delIncome'in d){const x=findIncome(t);if(x){if(x.received)S.accounts[x.dest].amount-=x.amount;S.incomes=S.incomes.filter(i=>i.id!==x.id);save();render();}}
  if('currency'in d){const x=findIncome(t);if(x&&!x.received){x.cur=x.cur==='USD'?'ARS':'USD';x.dest=x.cur==='USD'?'pp':'mp';save();renderIngresos();}}
  if('collect'in d){
    const x=findIncome(t);if(!x)return;
    if(!x.received){S.accounts[x.dest].amount+=x.amount;x.received=true;x.receivedAt=Date.now();}
    else{S.accounts[x.dest].amount-=x.amount;x.received=false;delete x.receivedAt;}
    save();render();
  }
});
render();
</script>
</body>
</html>
