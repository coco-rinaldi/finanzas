<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="money honey">
<meta name="theme-color" content="#f2ede4">
<title>what ’bout money honey?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --paper:#f2ede4; --ink:#171614; --mute:#8b857a; --hair:rgba(23,22,20,.16); --red:#b3321b;
  --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--paper);-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.3;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
em{font-style:italic}

.page{max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 40px)}
.kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

/* encabezado */
.date{border-bottom:1px solid var(--ink);padding-bottom:6px}
h1{font-weight:400;font-size:clamp(36px,11.5vw,54px);line-height:.88;letter-spacing:-.025em;
  margin:10px 0 0;padding-bottom:10px;border-bottom:3px double var(--ink)}
nav{display:flex;justify-content:space-between;padding:6px 0 8px;border-bottom:1px solid var(--hair);margin-bottom:14px}
nav button{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:6px 0}
nav button.on{color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.tab{display:none}
.tab.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* bloques */
.duo{display:grid;grid-template-columns:1fr 1fr}
.duo > :last-child{border-left:1px solid var(--hair);padding-left:14px;text-align:right}
.duo > :first-child{padding-right:14px}
.acct{padding:10px 0 12px}
.acct-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.acct.r .acct-head{flex-direction:row-reverse}
.plus{flex:none;width:24px;height:24px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;
  font-size:17px;line-height:1;padding-bottom:2px;text-align:center}
.plus:active{background:var(--ink);color:var(--paper)}
.amount{display:block;width:100%;font-size:clamp(26px,8vw,34px);line-height:1;letter-spacing:-.02em;margin:8px 0 5px}
.acct.r .amount{text-align:right}
.cs{font-size:.45em;font-style:italic;vertical-align:top;margin-right:.15em;letter-spacing:0;line-height:1.7}
.foot{font-style:italic;color:var(--mute);font-size:12.5px;line-height:1.25}

.sec{border-top:1px solid var(--ink);margin-top:4px}
.sec-k{display:flex;justify-content:space-between;padding:7px 0 2px}
.part{padding:8px 0 10px}
.big{font-size:52px;line-height:.85;letter-spacing:-.04em}
.big em{font-size:.36em;vertical-align:top;letter-spacing:0;margin-left:.05em;line-height:1.5}
.part .kicker{margin:6px 0 2px}
.pamt{font-size:22px;line-height:1.1;letter-spacing:-.01em}
.chill-t{font-style:italic;font-size:15px;margin-top:4px}
.heart{color:var(--red);font-style:normal}

.cov{border-top:1px solid var(--hair);padding-top:8px}
.note{font-style:italic;font-size:14px;margin-bottom:8px;text-align:justify}
.row{display:flex;align-items:baseline;gap:6px;font-size:14.5px}
.lead{flex:1;min-width:12px;border-bottom:1px dotted var(--mute);transform:translateY(-4px)}
.bar{height:1px;background:var(--hair);position:relative;margin:3px 0 7px}
.bar i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink)}
.bar.warn i{background:var(--red)}
.flag{color:var(--red);vertical-align:-1px;margin-left:5px}

.total{border-top:3px double var(--ink);margin-top:10px;padding-top:8px;text-align:center}
.tamt{font-size:clamp(34px,11vw,46px);line-height:1;letter-spacing:-.025em;margin:8px 0 4px}
.rate{font-style:italic;font-size:13.5px;color:var(--mute);padding:4px 0}
.rate u{color:var(--ink);text-decoration-style:dotted;text-underline-offset:3px}

/* listas */
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
h2{font-weight:400;font-size:34px;line-height:.9;letter-spacing:-.02em}
.sec-h em{font-size:14px;color:var(--mute)}
.item{display:flex;align-items:baseline;gap:6px;padding:9px 0;border-bottom:1px solid var(--hair)}
.in{font-family:var(--serif);font-size:16px;color:var(--ink);background:none;border:0;border-radius:0;padding:0;
  outline:none;-webkit-appearance:none;min-width:24px}
.in.n{max-width:52%}
.in.v{text-align:right}
.in:focus{border-bottom:1px solid var(--ink);margin-bottom:-1px}
.in::placeholder{color:var(--mute);font-style:italic}
.cs2,.curb{font-style:italic;font-size:12px;color:var(--mute)}
.curb{border-bottom:1px dotted var(--mute);padding:2px 0}
.x{font-size:17px;color:var(--mute);width:26px;text-align:right;line-height:1}
.add{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:12px 0;color:var(--mute)}
.sum{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ink);padding-top:8px}
.sum .v{font-size:28px;letter-spacing:-.02em}
.after{margin-top:10px;font-style:italic}

/* hoja */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:10;background:var(--paper);
  border-top:1px solid var(--ink);padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet h3{font-weight:400;font-style:italic;font-size:26px;line-height:1.05;margin:4px 0 14px}
#f-amt{display:block;width:100%;font-family:var(--serif);font-size:30px;background:none;color:var(--ink);
  border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:2px 0;outline:none;-webkit-appearance:none;margin-bottom:14px}
#f-amt.err{border-bottom-color:var(--red)}
.sh-actions{display:flex;justify-content:flex-end;align-items:center;gap:20px}
.sh-actions button{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:10px 0}
#sh-ok{background:var(--ink);color:var(--paper);padding:11px 18px}
</style>
</head>
<body>
<main class="page">
  <header>
    <p class="date kicker" id="fecha"></p>
    <h1>what ’bout <em>money honey?</em></h1>
    <nav>
      <button data-tab="ahora" class="on">ahora</button>
      <button data-tab="gastos">gastos</button>
      <button data-tab="ingresos">ingresos</button>
    </nav>
  </header>
  <section id="ahora" class="tab on"></section>
  <section id="gastos" class="tab"></section>
  <section id="ingresos" class="tab"></section>
</main>

<div id="scrim"></div>
<form id="sheet" autocomplete="off">
  <p class="kicker" id="sh-kicker"></p>
  <h3 id="sh-title"></h3>
  <input id="f-amt" type="text" inputmode="decimal" placeholder="0">
  <div class="sh-actions">
    <button type="button" id="sh-cancel">cancelar</button>
    <button type="submit" id="sh-ok">guardar</button>
  </div>
</form>

<script>
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const KEY='economia.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);

const DEF={
  accounts:{mp:{amount:0,last:null},pp:{amount:0,last:null},ef:{amount:0,last:null}},
  rate:1500,
  gastos:[['alquiler',412000],['expensas',87000],['luz',50000],['gas',25000],['internet',25000],['datos',15000]]
    .map(([name,amount])=>({id:uid(),name,amount})),
  ingresos:[
    {id:uid(),name:'klapa',amount:900000,cur:'ARS'},
    {id:uid(),name:'viviana',amount:200000,cur:'ARS'},
    {id:uid(),name:'brukas',amount:200,cur:'USD'}
  ]
};
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.accounts) S=JSON.parse(JSON.stringify(DEF));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const ACC={mp:{name:'Mercado Pago',cur:'ARS'},ef:{name:'Efectivo',cur:'ARS'},pp:{name:'PayPal',cur:'USD'}};

/* formato */
const nf=(n,d=0)=>Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:d});
const ars=n=>'$ '+nf(Math.round(n));
const usd=n=>'US$ '+nf(n,2);
const money=(n,cur='ARS')=>`<span class="cs">${cur==='USD'?'US$':'$'}</span>${cur==='USD'?nf(n,2):nf(Math.round(n))}`;
const pct=p=>Math.floor(p*100)+'%';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function parse(str){
  let s=String(str).trim().replace(/[^\d.,-]/g,'');
  if(!s) return null;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s);
  return isNaN(n)?null:n;
}
const FLAG='<svg class="flag" viewBox="0 0 12 14" width="10" height="12" aria-label="alerta"><path d="M1.2 0v14" stroke="currentColor" stroke-width="1.4"/><path d="M1.9 1h9l-2.4 3.2 2.4 3.3h-9z" fill="currentColor"/></svg>';

const now=new Date();
const monthAt=i=>MESES[(now.getMonth()+i)%12];   // 0 = mes actual
const totalGastos=()=>S.gastos.reduce((a,g)=>a+(g.amount||0),0);
const totalIngresos=()=>S.ingresos.reduce((a,g)=>a+(g.cur==='USD'?(g.amount||0)*S.rate:(g.amount||0)),0);

/* ahora */
function acctHTML(k,num,align,sub){
  const a=S.accounts[k], c=ACC[k];
  let foot=sub;
  if(a.last){
    const d=new Date(a.last.t);
    foot=`último: +${c.cur==='USD'?usd(a.last.v):ars(a.last.v)} · ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;
    if(k==='pp') foot=sub+'<br>'+foot;
  }
  return `<div class="acct ${align}">
    <div class="acct-head"><span class="kicker">${num} — ${c.name}</span><button class="plus" data-add="${k}" aria-label="sumar ingreso">+</button></div>
    <button class="amount" data-edit="${k}">${money(a.amount,c.cur)}</button>
    <div class="foot">${foot}</div></div>`;
}

function renderAhora(){
  const A=S.accounts, pesos=A.mp.amount+A.ef.amount, G=totalGastos();
  const serio=pesos*.8, chill=pesos*.2, T=pesos+A.pp.amount*S.rate;

  const cov=[];
  if(G>0){
    let rest=serio;
    for(let i=0;i<24;i++){
      const p=Math.max(0,Math.min(rest/G,1));
      cov.push({m:monthAt(i),p,i}); rest-=G;
      if(i>=1&&(p<1||rest<=0)) break;
    }
  }
  const alarm=G>0&&serio<2*G;

  let note='';
  if(!G) note='No hay gastos cargados.';
  else if(cov[0].p<1) note=`Cubre el ${pct(cov[0].p)} de ${cov[0].m}.`;
  else{
    const full=cov.filter(c=>c.p>=1), part=cov.find(c=>c.p<1&&c.p>0);
    note= full.length===1 ? `${cap(full[0].m)}, cubierto.` : `De ${full[0].m} a ${full[full.length-1].m}, todo cubierto.`;
    if(part) note+=` De ${part.m}, el ${pct(part.p)}.`;
  }
  if(alarm) note+=` No llega a ${monthAt(0)} y ${monthAt(1)}.${FLAG}`;

  $('#ahora').innerHTML=`
    <div class="duo">
      ${acctHTML('mp','I','l','pesos')}
      ${acctHTML('ef','II','r','pesos, en mano')}
    </div>

    <div class="sec">
      <div class="sec-k kicker"><span>el reparto</span><span>sobre ${ars(pesos)}</span></div>
      <div class="duo">
        <div class="part">
          <div class="big">80<em>%</em></div>
          <p class="kicker">lo que sostiene</p>
          <p class="pamt">${money(serio)}</p>
        </div>
        <div class="part">
          <div class="big">20<em>%</em></div>
          <p class="kicker">lo que se disfruta</p>
          <p class="pamt">${money(chill)}</p>
          <p class="chill-t">usalo chill <span class="heart">&lt;3</span></p>
        </div>
      </div>
      ${G?`<div class="cov">
        <p class="note">${note}</p>
        ${cov.map(c=>{
          const warn=alarm&&c.i<2&&c.p<1;
          return `<div class="row"><span>${c.m}</span><span class="lead"></span><span>${c.p>=1?'<em>cubierto</em>':pct(c.p)}${warn?FLAG:''}</span></div>
          <div class="bar${warn?' warn':''}"><i style="width:${c.p*100}%"></i></div>`;
        }).join('')}
      </div>`:`<p class="note">${note}</p>`}
    </div>

    <div class="sec">
      <div class="sec-k kicker"><span>el ahorro</span><span>no se toca</span></div>
      ${acctHTML('pp','III','l',`salvo emergencia · ≈ ${ars(A.pp.amount*S.rate)}`)}
    </div>

    <div class="total">
      <p class="kicker">todo junto, con el ahorro</p>
      <p class="tamt">${money(T)}</p>
      <button class="rate" data-rate>con el dólar a <u>${ars(S.rate)}</u></button>
    </div>`;
}

/* listas editables */
function rowsHTML(kind){
  return S[kind].map(g=>`
    <div class="item" data-k="${kind}" data-id="${g.id}">
      <input class="in n" data-f="name" value="${esc(g.name)}" placeholder="concepto" enterkeyhint="done">
      <span class="lead"></span>
      ${kind==='ingresos'
        ? `<button class="curb" data-cur-toggle>${g.cur==='USD'?'US$':'$'}</button>`
        : `<span class="cs2">$</span>`}
      <input class="in v" data-f="amount" value="${g.amount?nf(g.amount,2):''}" placeholder="0" inputmode="decimal" enterkeyhint="done">
      <button class="x" data-del aria-label="borrar">×</button>
    </div>`).join('');
}
function renderGastos(){
  $('#gastos').innerHTML=`
    <header class="sec-h"><h2>Gastos</h2><em>por mes</em></header>
    ${rowsHTML('gastos')}
    <button class="add" data-new="gastos">+ agregar</button>
    <div class="sum"><span class="kicker">total</span><span class="v" id="g-sum"></span></div>`;
}
function renderIngresos(){
  $('#ingresos').innerHTML=`
    <header class="sec-h"><h2>Ingresos</h2><em>esperados en ${monthAt(1)}</em></header>
    ${rowsHTML('ingresos')}
    <button class="add" data-new="ingresos">+ agregar</button>
    <div class="sum"><span class="kicker">total</span><span class="v" id="i-sum"></span></div>
    <div class="row after"><span>después de los gastos</span><span class="lead"></span><span id="i-after"></span></div>`;
}
function updateSums(){
  const G=totalGastos(), I=totalIngresos(), m=I-G;
  const gs=$('#g-sum'), is=$('#i-sum'), ia=$('#i-after');
  if(gs) gs.innerHTML=money(G);
  if(is) is.innerHTML=money(I);
  if(ia) ia.textContent=(m<0?'− ':'')+ars(Math.abs(m));
  renderAhora();
}

const ctx=document.createElement('canvas').getContext('2d');
function fit(i){
  const cs=getComputedStyle(i);
  ctx.font=`${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  i.style.width=Math.ceil(ctx.measureText(i.value||i.placeholder).width)+6+'px';
}
const fitAll=()=>document.querySelectorAll('.in').forEach(fit);

function render(){
  const d=now;
  $('#fecha').textContent=`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
  renderGastos(); renderIngresos(); updateSums(); fitAll();
}

const itemOf=el=>{const r=el.closest('.item');return r&&S[r.dataset.k].find(x=>x.id===r.dataset.id);};

document.addEventListener('input',e=>{
  const inp=e.target.closest('.item .in'); if(!inp) return;
  const it=itemOf(inp);
  if(inp.dataset.f==='name') it.name=inp.value;
  else{const n=parse(inp.value); it.amount=n===null?0:n;}
  fit(inp); save(); updateSums();
});
document.addEventListener('focusout',e=>{
  const inp=e.target.closest&&e.target.closest('.item .in.v'); if(!inp) return;
  const it=itemOf(inp); if(!it) return;
  inp.value=it.amount?nf(it.amount,2):''; fit(inp);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList.contains('in')){e.preventDefault();e.target.blur();}
});

/* hoja (saldos y dólar) */
let cfg=null; const fAmt=$('#f-amt');
function openSheet(c){
  cfg=c;
  $('#sh-kicker').textContent=c.kicker||''; $('#sh-title').textContent=c.title;
  fAmt.value=c.amount!=null?nf(c.amount,2):''; fAmt.classList.remove('err');
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
  fAmt.focus({preventScroll:true}); if(fAmt.value) fAmt.select();
}
function closeSheet(){
  $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on');
  fAmt.blur(); cfg=null;
}
$('#sheet').addEventListener('submit',e=>{
  e.preventDefault(); if(!cfg) return;
  const n=parse(fAmt.value); if(n===null){fAmt.classList.add('err');return;}
  cfg.onSave(n); save(); closeSheet(); render();
});
$('#sh-cancel').onclick=closeSheet;
$('#scrim').onclick=closeSheet;

/* clicks */
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t||t.closest('#sheet')) return;
  const d=t.dataset;

  if(d.tab){
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===t));
    document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id===d.tab));
    window.scrollTo(0,0); return;
  }
  if(d.add){
    const acc=S.accounts[d.add];
    openSheet({kicker:ACC[d.add].name,title:'Sumar un ingreso',
      onSave:v=>{acc.amount+=v;acc.last={v,t:Date.now()};}});
  }
  if(d.edit){
    const acc=S.accounts[d.edit];
    openSheet({kicker:ACC[d.edit].name,title:'Corregir el saldo',amount:acc.amount,onSave:v=>{acc.amount=v;}});
  }
  if('rate' in d){
    openSheet({kicker:'tipo de cambio',title:'¿A cuánto está el dólar?',amount:S.rate,onSave:v=>{S.rate=v;}});
  }
  if('del' in d){
    const r=t.closest('.item'); S[r.dataset.k]=S[r.dataset.k].filter(x=>x.id!==r.dataset.id);
    save(); render();
  }
  if('curToggle' in d){
    const it=itemOf(t); it.cur=it.cur==='USD'?'ARS':'USD'; save(); render();
  }
  if(d.new){
    const it={id:uid(),name:'',amount:0}; if(d.new==='ingresos') it.cur='ARS';
    S[d.new].push(it); save(); render();
    const inp=document.querySelector(`.item[data-id="${it.id}"] .in.n`); inp&&inp.focus();
  }
});

/* ícono de inicio */
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{
  fitAll();
  try{
    const c=document.createElement('canvas');c.width=c.height=180;
    const x=c.getContext('2d');
    x.fillStyle='#f2ede4';x.fillRect(0,0,180,180);
    x.fillStyle='#171614';x.font='italic 120px "Instrument Serif", Georgia, serif';
    x.textAlign='center';x.fillText('m',90,112);
    x.fillRect(40,140,100,1.5);
    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');
    document.head.appendChild(l);
  }catch(e){}
});

render();
</script>
</body>
</html>
