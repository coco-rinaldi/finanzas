<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="money honey">
<meta name="theme-color" content="#faf9f6">
<title>dinero · panorama personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#faf9f6;--ink:#24231f;--mute:#77756e;--hair:rgba(36,35,31,.16);--green:#647765;--red:#a45f55;--serif:'Instrument Serif',Georgia,serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
.page{max-width:800px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 52px)}
.date{border-bottom:1px solid var(--hair);padding:0 0 9px;margin-bottom:26px}
.kicker{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(48px,10vw,76px);line-height:.82;letter-spacing:-.045em;margin:8px 0 28px}
h1 em{font-style:italic}
nav{display:flex;gap:30px;border-bottom:1px solid var(--hair);margin-bottom:30px;overflow-x:auto}
nav button{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:0 0 10px;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom:2px solid var(--ink);margin-bottom:-1px}
.tab{display:none}.tab.on{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(42px,9vw,58px);line-height:.85;letter-spacing:-.03em}
.sec-h{border-bottom:1px solid var(--hair);padding-bottom:9px;margin-bottom:10px}
.editorial-card{border-radius:3px;background:#f0eee8;padding:22px}
.card-title{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute);margin-bottom:17px}
.total-block{padding:18px 22px;background:#24231f;color:#faf9f6;border-radius:3px;margin-bottom:14px}
.total-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#c7c3b9}
.total-value{font:clamp(38px,8vw,58px)/1 var(--serif);margin-top:6px}
.account-row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px 0;border-bottom:1px solid var(--hair)}
.account-name{font-family:var(--serif);font-size:23px;line-height:1.05}
.account-total{grid-column:2;grid-row:1/3;font-family:var(--serif);font-size:28px;text-align:right}
.account-sub{grid-column:1;font-size:11px;font-style:italic;color:var(--mute)}
.reserve-account-value{font:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.account-actions{grid-column:1;display:flex;gap:13px;margin-top:5px}
.small-action{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:underline dotted;text-underline-offset:3px}
.rate-line{margin-top:14px;font-size:12px;color:var(--mute);font-style:italic}
.rate-line button{text-decoration:underline dotted;text-underline-offset:3px}
.month-card{border-radius:4px;padding:19px 20px 16px;margin:12px 0;background:#edf0eb}
.month-card:nth-of-type(4n+2){background:#eaf0f3}.month-card:nth-of-type(4n+3){background:#f2efe2}.month-card:nth-of-type(4n+4){background:#f2e9e6}
.month-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.month-head strong{font-family:var(--serif);font-size:30px;font-weight:400}
.month-head span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.month-summary{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:11px}
.bar{height:5px;background:rgba(25,24,21,.13);position:relative;margin:9px 0 12px;overflow:hidden}
.bar i,.ob-bar i{position:absolute;left:0;top:0;height:100%;background:var(--green)}
.bar.warn i,.ob-bar.warn i{background:var(--red)}
.obligation,.item{border-top:1px solid rgba(36,35,31,.13);padding:12px 0 9px}
.ob-top{display:flex;align-items:center;gap:8px}
.ob-edit{display:flex;align-items:center;gap:7px 9px;margin-top:7px;flex-wrap:wrap}
.ob-edit label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.in{font-family:var(--serif);font-size:16px;background:none;border:0;border-bottom:1px solid var(--hair);border-radius:0;padding:3px 0;outline:none;min-width:0}
.in:focus{border-color:var(--ink)}
.in.name{flex:1;font-size:21px;width:100%}
.in.money,.in.reserve{width:88px;text-align:right}
.source,.item select{font-size:9px;background:none;border:0;border-bottom:1px dotted var(--mute);border-radius:0;padding:3px 0;max-width:130px;color:var(--mute)}
.ob-bar{height:3px;background:rgba(25,24,21,.12);margin-top:8px;position:relative}
.status{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.status.received{color:var(--green)}
.add{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:14px 0 3px}
.income-line{display:grid;grid-template-columns:minmax(90px,1fr) auto auto 25px;gap:10px;align-items:center}
.income-line .amount-in{width:94px;text-align:right}
.currency{font-size:10px;color:var(--mute);border-bottom:1px dotted var(--mute);padding:3px 0}
.x{font-size:18px;color:var(--mute);width:24px;text-align:right;line-height:1}
.income-meta{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:8px;flex-wrap:wrap}
.collect{font-size:9px;letter-spacing:.1em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.collect.done{color:var(--green)}
.sum{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--hair);padding-top:9px;margin-top:13px}
.sum .v{font-family:var(--serif);font-size:28px;letter-spacing:-.02em}
#cmd-in{display:block;width:100%;font-family:var(--serif);font-size:24px;line-height:1.2;background:#f0eee8;border:0;border-radius:3px;padding:16px;outline:none;resize:none}
.cmd-actions{display:flex;justify-content:space-between;align-items:center;margin:12px 0 22px}
.cmd-actions button{font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:12px 19px;border:1px solid var(--ink)}
#cmd-send{background:var(--ink);color:var(--paper)}
#mic.rec{background:var(--red);border-color:var(--red);color:#fff}
.log{padding:12px 0;border-top:1px solid var(--hair)}
.log .q{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--mute)}
.log .a{font-size:12px;margin-top:3px}.log .a.bad{color:var(--red)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:10;background:var(--paper);border-top:1px solid var(--ink);padding:20px 22px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet h3{font-family:var(--serif);font-weight:400;font-style:italic;font-size:30px;line-height:1.05;margin:5px 0 16px}
#f-amt{display:block;width:100%;font-family:var(--serif);font-size:34px;background:none;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:3px 0;outline:none;margin-bottom:16px}
#f-amt.err{border-bottom-color:var(--red)}
#f-dest{font-size:11px;background:none;border:0;border-bottom:1px solid var(--hair);padding:9px 0;width:100%;margin-bottom:16px}
.sh-actions{display:flex;justify-content:flex-end;align-items:center;gap:20px}
.sh-actions button{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute);padding:11px 0}
#sh-ok{background:var(--ink);color:var(--paper);padding:12px 19px}
@media(max-width:620px){.page{padding-left:16px;padding-right:16px}.editorial-card{padding:18px}}
@media(max-width:370px){.income-line{grid-template-columns:minmax(60px,1fr) auto auto 20px;gap:5px}.income-line .amount-in{width:72px}.in.money,.in.reserve{width:76px}}
</style>
</head>
<body>
<main class="page">
  <header>
    <p class="date kicker" id="fecha"></p>
    <h1>what ’bout<br><em>money honey?</em></h1>
    <nav>
      <button data-tab="actualizar" class="on">actualizar</button>
      <button data-tab="ahora">resumen</button>
      <button data-tab="reservas">gastos</button>
      <button data-tab="ingresos">ingresos</button>
    </nav>
  </header>
  <section id="actualizar" class="tab on">
    <form id="cmd" autocomplete="off">
      <textarea id="cmd-in" rows="3" placeholder="saqué 5.000 de mercado pago…"></textarea>
      <div class="cmd-actions"><button type="button" id="mic">● hablar</button><button type="submit" id="cmd-send">enviar</button></div>
    </form>
    <div id="log"></div>
  </section>
  <section id="ahora" class="tab"></section>
  <section id="reservas" class="tab"></section>
  <section id="ingresos" class="tab"></section>
</main>
<div id="scrim"></div>
<form id="sheet" autocomplete="off">
  <p class="kicker" id="sh-kicker"></p>
  <h3 id="sh-title"></h3>
  <input id="f-amt" type="text" inputmode="decimal" placeholder="0">
  <select id="f-dest" hidden><option value="mp">Mercado Pago</option><option value="ef">Efectivo</option><option value="pp">PayPal</option></select>
  <div class="sh-actions"><button type="button" id="sh-cancel">cancelar</button><button type="submit" id="sh-ok">guardar</button></div>
</form>
<script>
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const KEY='moneyhoney.v2';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const now=new Date();
const monthKey=(o=0)=>{const d=new Date(now.getFullYear(),now.getMonth()+o,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const monthLabel=k=>{const [y,m]=k.split('-').map(Number);return `${MESES[m-1]} ${y}`};
const mkFromText=s=>{const t=norm(s),i=MESES.findIndex(m=>t.includes(norm(m))),y=(t.match(/20\d\d/)||[])[0];return i>=0&&y?`${y}-${String(i+1).padStart(2,'0')}`:monthKey(0)};
function makeMonth(key,cur=false){
  return {key,obligations:[
    {id:uid(),name:'alquiler',amount:412000,reserved:cur?412000:0,source:'mp'},
    {id:uid(),name:'servicios',amount:100000,reserved:cur?100000:0,source:'mp'},
    {id:uid(),name:'expensas',amount:90000,reserved:cur?90000:0,source:'ef'},
    {id:uid(),name:'comida',amount:80000,reserved:cur?40000:0,source:'mp'}]};
}
const DEF={
  accounts:{mp:{amount:413000,last:null},pp:{amount:654,last:null},ef:{amount:360000,last:null}},
  rate:1500,months:Array.from({length:4},(_,i)=>makeMonth(monthKey(i),i===0)),
  incomes:[
    {id:uid(),name:'brukas',mk:'2026-10',amount:200,cur:'USD',received:false,dest:'pp'},
    {id:uid(),name:'brukas',mk:'2026-11',amount:200,cur:'USD',received:false,dest:'pp'},
    {id:uid(),name:'brukas',mk:'2026-12',amount:200,cur:'USD',received:false,dest:'pp'},
    {id:uid(),name:'viviana',mk:'2026-10',amount:200000,cur:'ARS',received:false,dest:'mp'},
    {id:uid(),name:'viviana',mk:'2026-11',amount:200000,cur:'ARS',received:false,dest:'mp'},
    {id:uid(),name:'marvills',mk:'2026-11',amount:260000,cur:'ARS',received:false,dest:'mp'},
    {id:uid(),name:'klapa',mk:'2026-11',amount:450000,cur:'ARS',received:false,dest:'mp'}],
  log:[]
};
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.accounts||!S.months||!S.incomes)S=JSON.parse(JSON.stringify(DEF));
S.log=S.log||[];
{const old=S.months;S.months=Array.from({length:4},(_,i)=>{const k=monthKey(i);return old.find(m=>m.key===k)||makeMonth(k,i===0)});}
S.incomes.forEach(x=>{if(!x.mk)x.mk=mkFromText(x.month)});
for(const k of ['mp','ef','pp'])if(S.accounts[k].reserved==null)S.accounts[k].reserved=S.months.reduce((a,m)=>a+m.obligations.reduce((b,o)=>b+(o.source===k?(Number(o.reserved)||0):0),0),0);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const ACC={mp:{name:'Mercado Pago',cur:'ARS'},ef:{name:'Efectivo',cur:'ARS'},pp:{name:'PayPal',cur:'USD'}};
const nf=(n,d=0)=>Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:d});
const ars=n=>'$ '+nf(Math.round(n));
const usd=n=>'US$ '+nf(n,2);
const fmt=(k,n)=>ACC[k].cur==='USD'?usd(n):ars(n);
const money=(n,cur='ARS')=>`${cur==='USD'?'US$':'$'} ${cur==='USD'?nf(n,2):nf(Math.round(n))}`;
const pct=p=>`${Math.round(p*100)}%`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function parse(str){
  let s=String(str).trim().replace(/[^\d.,-]/g,'');
  if(!s)return null;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return Number.isFinite(n)?n:null;
}
const totalForMonth=m=>m.obligations.reduce((a,o)=>a+(Number(o.amount)||0),0);
const reservedForMonth=m=>m.obligations.reduce((a,o)=>a+(Number(o.reserved)||0),0);
const allocation=k=>Number(S.accounts[k].reserved)||0;
const free=k=>S.accounts[k].amount-allocation(k);
const totalMoney=()=>S.accounts.mp.amount+S.accounts.ef.amount+(S.accounts.pp.amount*S.rate);
const coverage=m=>totalForMonth(m)>0?Math.min(1,reservedForMonth(m)/totalForMonth(m)):0;
const incSum=(mk,cur,rec)=>S.incomes.filter(x=>x.mk===mk&&x.cur===cur&&x.received===rec).reduce((a,x)=>a+x.amount,0);
const pendingTotal=c=>S.incomes.filter(x=>!x.received&&x.cur===c).reduce((a,x)=>a+x.amount,0);
const receivedTotal=c=>S.incomes.filter(x=>x.received&&x.cur===c).reduce((a,x)=>a+x.amount,0);
const incMonths=()=>[...new Set([...S.months.map(m=>m.key),...S.incomes.map(x=>x.mk)])].sort();

/* ---------- actualizar: interpreta texto libre ---------- */
const ACCRX={mp:/mercado ?pago|\bmp\b/,ef:/efectivo|\bcash\b|billetera/,pp:/paypal|\bpp\b/};
const RX={
  out:/\b(saque|saco|sacamos|gaste|gasto|pague|pago|retire|compre|extraje|me cobraron|perdi|descontaron)\b/,
  inn:/\b(entro|entraron|cobre|cobro|recibi|deposite|ingreso|ingresaron|me pagaron|pagaron|depositaron|sume|acreditaron|acredito|agregue|me llego|me llegaron)\b/,
  mov:/\b(pase|movi|transferi|mande|cambie|traspase)\b/,
  res:/\b(reserve|aparte|separe|abone|abonar|reservar|guarde para)\b/};
function findAccs(t){return Object.entries(ACCRX).map(([k,r])=>{const m=t.match(r);return m?{k,i:m.index}:null}).filter(Boolean).sort((a,b)=>a.i-b.i)}
function findAmount(t){
  const m=t.match(/(\d[\d.,]*)\s*(mil\b|k\b|lucas?\b|palos?\b)?/);if(!m)return null;
  let n=parse(m[1]);if(n===null)return null;
  if(m[2]){n*=/^palo/.test(m[2])?1e6:1000}
  return n;
}
const allObs=()=>S.months.flatMap(m=>m.obligations.map(o=>({m,o})));
function collect(x,dest){if(dest)x.dest=dest;S.accounts[x.dest].amount+=x.amount;x.received=true;x.receivedAt=Date.now();}
function interpret(raw){
  const t=norm(raw),amt0=findAmount(t),accs=findAccs(t),isUsd=/\b(usd|us\$|u\$s|dolar|dolares|verdes)\b|us\$/.test(t);
  const out=RX.out.test(t),inn=RX.inn.test(t),mov=RX.mov.test(t),res=RX.res.test(t);
  // cobrar un ingreso previsto por nombre
  if(inn||/\bcobr/.test(t)){
    const x=S.incomes.filter(i=>!i.received&&norm(i.name).length>=3&&t.includes(norm(i.name))).sort((a,b)=>a.mk.localeCompare(b.mk))[0];
    if(x&&!x.received){if(amt0!==null)x.amount=isUsd||x.cur==='USD'?amt0:amt0;collect(x,accs[0]&&accs[0].k);return {ok:true,msg:`${x.name} (${monthLabel(x.mk)}) cobrado: ${money(x.amount,x.cur)} → ${ACC[x.dest].name}`}}
  }
  if(amt0===null)return {ok:false,msg:'no vi ningún monto. probá: “saqué 5000 de mercado pago”'};
  let amt=amt0;
  const ob=allObs().filter(({o})=>t.includes(norm(o.name))&&norm(o.name).length>=3).sort((a,b)=>(a.o.reserved>=a.o.amount)-(b.o.reserved>=b.o.amount))[0];
  if(res){
    if(!ob)return {ok:false,msg:'no encontré a qué gasto reservarlo'};
    const k=accs[0]?accs[0].k:ob.o.source;
    if(k!==ob.o.source){S.accounts[ob.o.source].reserved=Math.max(0,allocation(ob.o.source)-ob.o.reserved);S.accounts[k].reserved=allocation(k)+ob.o.reserved;ob.o.source=k}
    ob.o.reserved+=amt;S.accounts[k].reserved=allocation(k)+amt;
    return {ok:true,msg:`${ars(amt)} reservados para ${ob.o.name} (${monthLabel(ob.m.key)})`};
  }
  if(mov||(accs.length>=2&&!inn)){
    if(accs.length<2)return {ok:false,msg:'¿de qué cuenta a qué cuenta?'};
    let dest=accs.find(a=>/\b(a|en|hacia|para)\s+(\w+\s+)?$/.test(t.slice(Math.max(0,a.i-14),a.i)));
    let src=dest?accs.find(a=>a!==dest):accs[0];dest=dest||accs[1];
    const s=src.k,d=dest.k;let add=amt;
    if(ACC[s].cur!==ACC[d].cur)add=ACC[s].cur==='ARS'?amt/S.rate:amt*S.rate;
    S.accounts[s].amount-=amt;S.accounts[d].amount+=add;
    return {ok:true,msg:`${fmt(s,amt)} de ${ACC[s].name} → ${fmt(d,add)} en ${ACC[d].name}`};
  }
  if(!out&&!inn)return {ok:false,msg:'no entendí si entró o salió plata'};
  const k=accs[0]?accs[0].k:(ob&&out?ob.o.source:(isUsd?'pp':'mp'));
  if(isUsd&&ACC[k].cur==='ARS')amt*=S.rate;
  if(inn&&!out){S.accounts[k].amount+=amt;return {ok:true,msg:`+${fmt(k,amt)} en ${ACC[k].name} · saldo ${fmt(k,S.accounts[k].amount)}`}}
  S.accounts[k].amount-=amt;let extra='';
  if(ob){const p=Math.min(amt,ob.o.reserved);ob.o.reserved-=p;ob.o.amount=Math.max(0,ob.o.amount-amt);S.accounts[ob.o.source].reserved=Math.max(0,allocation(ob.o.source)-p);extra=` · descontado de ${ob.o.name}`}
  return {ok:true,msg:`−${fmt(k,amt)} de ${ACC[k].name} · saldo ${fmt(k,S.accounts[k].amount)}${extra}`};
}
const undoStack=[];
function runCmd(){
  const inp=$('#cmd-in'),txt=inp.value.trim();if(!txt)return;
  const snap=JSON.stringify(S);let r;
  try{r=interpret(txt)}catch(e){r={ok:false,msg:'algo falló, probá de nuevo'}}
  if(r.ok){undoStack.push(snap);if(undoStack.length>10)undoStack.shift();inp.value=''}
  S.log=[{q:txt,msg:r.msg,ok:r.ok},...S.log].slice(0,8);save();render();
}
function renderLog(){
  $('#log').innerHTML=S.log.map((l,i)=>`<div class="log"><p class="q">${esc(l.q||'')}</p><p class="a ${l.ok?'':'bad'}">${esc(l.msg)}${i===0&&l.ok&&undoStack.length?' · <button class="small-action" data-undo>deshacer</button>':''}</p></div>`).join('');
}
$('#cmd').addEventListener('submit',e=>{e.preventDefault();runCmd()});
$('#cmd-in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();runCmd()}});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
if(!SR)$('#mic').hidden=true;
$('#mic').onclick=()=>{
  if(rec){rec.stop();return}
  rec=new SR();rec.lang='es-AR';rec.interimResults=true;
  rec.onresult=e=>{$('#cmd-in').value=[...e.results].map(r=>r[0].transcript).join('')};
  rec.onend=()=>{rec=null;$('#mic').classList.remove('rec');$('#mic').textContent='● hablar';if($('#cmd-in').value.trim())runCmd()};
  rec.onerror=()=>{};
  $('#mic').classList.add('rec');$('#mic').textContent='■ parar';
  try{rec.start()}catch(e){rec=null}
};

/* ---------- vistas ---------- */
function accountHTML(k){
  const a=S.accounts[k],c=ACC[k];
  return `<div class="account-row">
    <span class="account-name">${c.name}</span>
    <div class="account-total">${money(a.amount,c.cur)}</div>
    <div class="account-sub">reservado <button class="reserve-account-value" data-edit-reserved="${k}">${ars(allocation(k))}</button> · libre ${ars(free(k))}</div>
    <div class="account-actions"><button class="small-action" data-edit="${k}">editar saldo</button><button class="small-action" data-add="${k}">+ sumar</button></div>
  </div>`;
}
function renderAhora(){
  $('#ahora').innerHTML=`<div class="total-block"><p class="total-label">dinero total</p><p class="total-value">${ars(totalMoney())}</p></div>
    <section class="editorial-card"><h2 class="card-title">tus cuentas</h2>${accountHTML('mp')}${accountHTML('ef')}${accountHTML('pp')}
    <p class="rate-line">dólar de referencia: <button data-rate>${ars(S.rate)}</button></p></section>`;
}
function obligationHTML(m,o){
  const p=o.amount>0?Math.min(1,o.reserved/o.amount):0;
  return `<div class="obligation" data-month="${m.key}" data-ob="${o.id}">
    <div class="ob-top"><input class="in name" data-obfield="name" value="${esc(o.name)}" aria-label="nombre del gasto"><button class="x" data-del-ob aria-label="eliminar gasto">×</button></div>
    <div class="ob-edit"><label>total $</label><input class="in money" data-obfield="amount" value="${nf(o.amount)}" inputmode="decimal" aria-label="monto total">
      <label>abonado $</label><input class="in reserve" data-obfield="reserved" value="${nf(o.reserved)}" inputmode="decimal" aria-label="monto abonado">
      <select class="source" data-obfield="source" aria-label="cuenta"><option value="mp" ${o.source==='mp'?'selected':''}>mercado pago</option><option value="ef" ${o.source==='ef'?'selected':''}>efectivo</option></select>
      <span class="status">${pct(p)} abonado</span></div>
    <div class="ob-bar ${p<1?'warn':''}"><i style="width:${p*100}%"></i></div></div>`;
}
function renderReservas(){
  $('#reservas').innerHTML=`<header class="sec-h"><h2>Gastos</h2></header>
    ${S.months.map(m=>`<section class="month-card" data-month-card="${m.key}">
      <div class="month-head"><strong>${cap(monthLabel(m.key))}</strong><span>${pct(coverage(m))} cubierto</span></div>
      <div class="month-summary"><span>abonado ${ars(reservedForMonth(m))} de ${ars(totalForMonth(m))}</span><span>resta ${ars(Math.max(0,totalForMonth(m)-reservedForMonth(m)))}</span></div>
      <div class="bar ${coverage(m)<1?'warn':''}"><i style="width:${coverage(m)*100}%"></i></div>
      ${m.obligations.map(o=>obligationHTML(m,o)).join('')}
      <button class="add" data-new-ob="${m.key}">+ agregar gasto</button></section>`).join('')}`;
}
function refreshMonth(key){
  const m=S.months.find(x=>x.key===key),card=document.querySelector(`[data-month-card="${key}"]`);if(!m||!card)return;
  const p=coverage(m),bar=card.querySelector(':scope > .bar');
  bar.classList.toggle('warn',p<1);bar.querySelector('i').style.width=`${p*100}%`;
  card.querySelector('.month-summary').innerHTML=`<span>abonado ${ars(reservedForMonth(m))} de ${ars(totalForMonth(m))}</span><span>resta ${ars(Math.max(0,totalForMonth(m)-reservedForMonth(m)))}</span>`;
  card.querySelector('.month-head span').textContent=`${pct(p)} cubierto`;
}
function incomeHTML(x,mks){
  const dests=[['mp','mercado pago'],['ef','efectivo'],['pp','paypal']];
  return `<div class="item" data-income="${x.id}">
    <div class="income-line">
      <input class="in name" data-if="name" value="${esc(x.name)}" aria-label="cliente">
      <button class="currency" data-currency>${x.cur==='USD'?'US$':'$'}</button>
      <input class="in amount-in" data-if="amount" value="${nf(x.amount,2)}" inputmode="decimal" aria-label="importe">
      <button class="x" data-del-income aria-label="eliminar ingreso">×</button>
    </div>
    <div class="income-meta">
      <select data-if="mk" aria-label="mes">${mks.map(k=>`<option value="${k}" ${x.mk===k?'selected':''}>${monthLabel(k)}</option>`).join('')}</select>
      <select data-if="dest" aria-label="cuenta">${dests.map(([v,l])=>`<option value="${v}" ${x.dest===v?'selected':''}>${l}</option>`).join('')}</select>
      <span class="status ${x.received?'received':''}">${x.received?'cobrado':'pendiente'}</span>
      <button class="collect ${x.received?'done':''}" data-collect>${x.received?'deshacer':'cobrar'}</button>
    </div></div>`;
}
function renderIngresos(){
  const mks=incMonths();
  const part=(mk,rec)=>[['ARS',incSum(mk,'ARS',rec)],['USD',incSum(mk,'USD',rec)]].filter(([,v])=>v>0).map(([c,v])=>money(v,c)).join(' · ')||'—';
  $('#ingresos').innerHTML=`<header class="sec-h"><h2>Ingresos</h2></header>
    ${mks.map(mk=>{const items=S.incomes.filter(x=>x.mk===mk);const pend=items.filter(x=>!x.received).length;
      return `<section class="month-card"><div class="month-head"><strong>${cap(monthLabel(mk))}</strong><span>${pend?pend+' pendiente'+(pend>1?'s':''):items.length?'todo cobrado':''}</span></div>
      <div class="month-summary"><span>pendiente ${part(mk,false)}</span><span>cobrado ${part(mk,true)}</span></div>
      ${items.map(x=>incomeHTML(x,mks)).join('')}
      <button class="add" data-new-income="${mk}">+ agregar ingreso</button></section>`}).join('')}
    <div class="sum"><span class="kicker">pendiente en pesos</span><span class="v">${ars(pendingTotal('ARS'))}</span></div>
    <div class="sum"><span class="kicker">pendiente en dólares</span><span class="v">${usd(pendingTotal('USD'))}</span></div>
    <div class="sum"><span class="kicker">ya cobrado · pesos</span><span class="v">${ars(receivedTotal('ARS'))}</span></div>
    <div class="sum"><span class="kicker">ya cobrado · dólares</span><span class="v">${usd(receivedTotal('USD'))}</span></div>`;
}
function render(){
  const d=new Date();
  $('#fecha').textContent=`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
  renderAhora();renderReservas();renderIngresos();renderLog();
}
function findIncome(el){const r=el.closest('.item[data-income]');return r&&S.incomes.find(x=>x.id===r.dataset.income)}
document.addEventListener('input',e=>{
  const ob=e.target.closest('[data-obfield]'),inc=e.target.closest('[data-if]');
  if(ob){
    const card=ob.closest('[data-month]'),m=S.months.find(x=>x.key===card.dataset.month),o=m&&m.obligations.find(x=>x.id===card.dataset.ob);
    if(!o)return;const f=ob.dataset.obfield;
    if(f==='name')o.name=ob.value;
    else if(f!=='source'){const n=parse(ob.value),next=n===null?0:n;
      if(f==='reserved'){const delta=next-(Number(o.reserved)||0);S.accounts[o.source].reserved=Math.max(0,allocation(o.source)+delta)}
      o[f]=next}
    save();refreshMonth(m.key);renderAhora();return;
  }
  if(inc){
    const x=findIncome(inc);if(!x)return;const f=inc.dataset.if;
    if(f==='amount'){const n=parse(inc.value),next=n===null?0:n;if(x.received)S.accounts[x.dest].amount+=next-x.amount;x.amount=next}
    if(f==='name')x.name=inc.value;
    save();
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('[data-obfield="source"]')){
    const card=el.closest('[data-month]'),m=S.months.find(x=>x.key===card.dataset.month),o=m&&m.obligations.find(x=>x.id===card.dataset.ob);
    if(o){const a=Number(o.reserved)||0;S.accounts[o.source].reserved=Math.max(0,allocation(o.source)-a);S.accounts[el.value].reserved=allocation(el.value)+a;o.source=el.value;save();renderAhora()}
    return;
  }
  if(el.matches('[data-obfield]')){save();renderReservas();renderAhora();return}
  if(el.matches('[data-if="dest"]')){const x=findIncome(el);if(x){if(x.received){S.accounts[x.dest].amount-=x.amount;S.accounts[el.value].amount+=x.amount}x.dest=el.value;save();renderAhora()}return}
  if(el.matches('[data-if="mk"]')){const x=findIncome(el);if(x){x.mk=el.value;save();renderIngresos()}return}
  if(el.matches('[data-if]')){save();renderIngresos();renderAhora()}
});
let cfg=null;const fAmt=$('#f-amt'),fDest=$('#f-dest');
function openSheet(c){
  cfg=c;$('#sh-kicker').textContent=c.kicker||'';$('#sh-title').textContent=c.title;
  fAmt.value=c.amount!=null?nf(c.amount,2):'';fAmt.classList.remove('err');
  fDest.hidden=!c.destination;fDest.value=c.destination||'mp';
  $('#scrim').classList.add('on');$('#sheet').classList.add('on');
  setTimeout(()=>{fAmt.focus({preventScroll:true});if(fAmt.value)fAmt.select()},80);
}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');fAmt.blur();cfg=null}
$('#sheet').addEventListener('submit',e=>{
  e.preventDefault();if(!cfg)return;
  const n=parse(fAmt.value);if(n===null||n<0){fAmt.classList.add('err');return}
  cfg.onSave(n,fDest.value);save();closeSheet();render();
});
$('#sh-cancel').onclick=closeSheet;$('#scrim').onclick=closeSheet;
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.closest('#sheet'))return;
  const d=t.dataset;
  if(d.tab){
    document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===t));
    document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id===d.tab));
    window.scrollTo(0,0);return;
  }
  if('undo'in d){
    if(undoStack.length){S=JSON.parse(undoStack.pop());S.log=[{q:'',msg:'deshecho',ok:true},...S.log.slice(1)];save();render()}
    return;
  }
  if(d.add){const k=d.add;openSheet({kicker:ACC[k].name,title:'Sumar dinero a la cuenta',amount:0,onSave:v=>{S.accounts[k].amount+=v;S.accounts[k].last={v,t:Date.now()}}})}
  if(d.edit){const k=d.edit;openSheet({kicker:ACC[k].name,title:'Corregir saldo total',amount:S.accounts[k].amount,onSave:v=>{S.accounts[k].amount=v}})}
  if(d.editReserved){const k=d.editReserved;openSheet({kicker:ACC[k].name,title:'¿Cuánto querés dejar reservado?',amount:allocation(k),onSave:v=>{S.accounts[k].reserved=v}})}
  if('rate'in d)openSheet({kicker:'tipo de cambio',title:'¿A cuánto está el dólar?',amount:S.rate,onSave:v=>{S.rate=v}});
  if('newOb'in d){const m=S.months.find(x=>x.key===d.newOb);if(m)m.obligations.push({id:uid(),name:'nuevo gasto',amount:0,reserved:0,source:'mp'});save();renderReservas();renderAhora()}
  if('delOb'in d){
    const card=t.closest('[data-month]'),m=S.months.find(x=>x.key===card.dataset.month);
    if(m){const g=m.obligations.find(o=>o.id===card.dataset.ob);if(g)S.accounts[g.source].reserved=Math.max(0,allocation(g.source)-(Number(g.reserved)||0));m.obligations=m.obligations.filter(o=>o.id!==card.dataset.ob);save();renderReservas();renderAhora()}
  }
  if('newIncome'in d){S.incomes.push({id:uid(),name:'nuevo cliente',mk:d.newIncome||monthKey(0),amount:0,cur:'ARS',received:false,dest:'mp'});save();renderIngresos()}
  if('delIncome'in d){const x=findIncome(t);if(x){if(x.received)S.accounts[x.dest].amount-=x.amount;S.incomes=S.incomes.filter(i=>i.id!==x.id);save();render()}}
  if('currency'in d){const x=findIncome(t);if(x){if(x.received)S.accounts[x.dest].amount-=x.amount;x.cur=x.cur==='USD'?'ARS':'USD';x.dest=x.cur==='USD'?'pp':'mp';if(x.received)S.accounts[x.dest].amount+=x.amount;save();render()}}
  if('collect'in d){
    const x=findIncome(t);if(!x)return;
    if(!x.received)collect(x);else{S.accounts[x.dest].amount-=x.amount;x.received=false;delete x.receivedAt}
    save();render();
  }
});
render();
</script>
</body>
</html>
